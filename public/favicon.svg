<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">

  <!-- 花穗（5層，置中） -->
  <g transform="translate(16,31)">
    <!-- 花莖 -->
    <line x1="0" y1="0" x2="0" y2="-27" stroke="#4a5020" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 第1層（底，最開，y≈-6） -->
    <path d="M0,-6 C-3,-7 -5,-5 -3.5,-3 Z" fill="#5a3872" opacity="0.9"/>
    <path d="M0,-6 C 3,-7  5,-5  3.5,-3 Z" fill="#5a3872" opacity="0.9"/>
    <ellipse cx="-3.5" cy="-8"   rx="3.0" ry="1.9" fill="#c080d0" transform="rotate(-38,-3.5,-8)"/>
    <ellipse cx="-2.0" cy="-6.5" rx="2.4" ry="1.5" fill="#d8a0e8" transform="rotate(-20,-2.0,-6.5)"/>
    <ellipse cx=" 3.5" cy="-8"   rx="3.0" ry="1.9" fill="#c080d0" transform="rotate(38,3.5,-8)"/>
    <ellipse cx=" 2.0" cy="-6.5" rx="2.4" ry="1.5" fill="#d8a0e8" transform="rotate(20,2.0,-6.5)"/>
    <ellipse cx="0"    cy="-7.5" rx="2.0" ry="2.8" fill="#b068c4"/>

    <!-- 第2層（y≈-12） -->
    <path d="M0,-12 C-2.5,-13 -4,-11.5 -3,-10 Z" fill="#5a3872" opacity="0.9"/>
    <path d="M0,-12 C 2.5,-13  4,-11.5  3,-10 Z" fill="#5a3872" opacity="0.9"/>
    <ellipse cx="-3.0" cy="-13.8" rx="2.6" ry="1.6" fill="#c280d2" transform="rotate(-34,-3.0,-13.8)"/>
    <ellipse cx="-1.7" cy="-12.5" rx="2.0" ry="1.3" fill="#d8a2e8" transform="rotate(-18,-1.7,-12.5)"/>
    <ellipse cx=" 3.0" cy="-13.8" rx="2.6" ry="1.6" fill="#c280d2" transform="rotate(34,3.0,-13.8)"/>
    <ellipse cx=" 1.7" cy="-12.5" rx="2.0" ry="1.3" fill="#d8a2e8" transform="rotate(18,1.7,-12.5)"/>
    <ellipse cx="0"    cy="-13.2" rx="1.8" ry="2.4" fill="#ae68c2"/>

    <!-- 第3層（y≈-17.5） -->
    <path d="M0,-17.5 C-2,-18.3 -3.2,-17 -2.4,-15.8 Z" fill="#5a3872" opacity="0.9"/>
    <path d="M0,-17.5 C 2,-18.3  3.2,-17  2.4,-15.8 Z" fill="#5a3872" opacity="0.9"/>
    <ellipse cx="-2.4" cy="-19"   rx="2.2" ry="1.4" fill="#c684d6" transform="rotate(-30,-2.4,-19)"/>
    <ellipse cx="-1.4" cy="-17.8" rx="1.7" ry="1.1" fill="#dca8ea" transform="rotate(-15,-1.4,-17.8)"/>
    <ellipse cx=" 2.4" cy="-19"   rx="2.2" ry="1.4" fill="#c684d6" transform="rotate(30,2.4,-19)"/>
    <ellipse cx=" 1.4" cy="-17.8" rx="1.7" ry="1.1" fill="#dca8ea" transform="rotate(15,1.4,-17.8)"/>
    <ellipse cx="0"    cy="-18.5" rx="1.6" ry="2.1" fill="#aa64be"/>

    <!-- 第4層（y≈-22） -->
    <path d="M0,-22 C-1.5,-22.7 -2.5,-21.5 -1.8,-20.5 Z" fill="#5a3872" opacity="0.9"/>
    <path d="M0,-22 C 1.5,-22.7  2.5,-21.5  1.8,-20.5 Z" fill="#5a3872" opacity="0.9"/>
    <ellipse cx="-1.8" cy="-23.3" rx="1.8" ry="1.2" fill="#c888d8" transform="rotate(-26,-1.8,-23.3)"/>
    <ellipse cx=" 1.8" cy="-23.3" rx="1.8" ry="1.2" fill="#c888d8" transform="rotate(26,1.8,-23.3)"/>
    <ellipse cx="0"    cy="-22.8" rx="1.4" ry="1.9" fill="#a660ba"/>

    <!-- 第5層（y≈-25.5，小花苞） -->
    <path d="M0,-25.5 C-1.1,-26.0 -1.8,-25 -1.2,-24.2 Z" fill="#5a3872" opacity="0.9"/>
    <path d="M0,-25.5 C 1.1,-26.0  1.8,-25  1.2,-24.2 Z" fill="#5a3872" opacity="0.9"/>
    <ellipse cx="-1.2" cy="-26.5" rx="1.3" ry="0.9" fill="#c07cce" transform="rotate(-20,-1.2,-26.5)"/>
    <ellipse cx=" 1.2" cy="-26.5" rx="1.3" ry="0.9" fill="#c07cce" transform="rotate(20,1.2,-26.5)"/>

    <!-- 頂端花苞 -->
    <ellipse cx="0" cy="-28.5" rx="2.2" ry="3.2" fill="#9850b0"/>
    <ellipse cx="0" cy="-29.8" rx="1.3" ry="1.9" fill="#b070c4" opacity="0.6"/>
  </g>

</svg>
